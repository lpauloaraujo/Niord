services:
  niord:
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    build: ./Server
    image: niord
    ports: ["8000:80"]
    env_file: ./Server/.env
    container_name: server

  redis:
    build: ./Redis
    image: redis 
    env_file: ./Redis/.env
    container_name: redis_db 
  db:
    image: postgres
    env_file: ./.env
    container_name: database

